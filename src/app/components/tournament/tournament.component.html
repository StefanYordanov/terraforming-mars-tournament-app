<div class="tournament-header">
    <p-breadcrumb [model]="$breadcrumbItems()"></p-breadcrumb>
    <div class="tournament-header-controls">
    <mat-button-toggle-group [(ngModel)]="selectedViews" aria-label="Font Style" multiple>
       <mat-button-toggle value="players">Players</mat-button-toggle>
       <mat-button-toggle checked disabled value="rounds">Rounds</mat-button-toggle>
       <mat-button-toggle value="ranking">Ranking</mat-button-toggle>
    </mat-button-toggle-group>
    </div>
</div>
<div class="container overflow-hidden">
    <div class="columns tournament-container">
    @if($tournamentId() && store.$state()?.players) {
        @if(isPlayersViewSelected()) {
           <div class="column  player-details">

               <div class="players-tab-header">
                   <h3>Players({{ $tournament()!.playersIds.length }})</h3>
                   <button pButton type="button" (click)="generateGameSessions()">generate</button>
               </div>
               <app-tournament-players-list-dumb 
               [players]="store.$state()!.players!" 
               [playerIds]="$tournament()!.playersIds" 
               (valuesChanged)="playersChanged($event)">
               </app-tournament-players-list-dumb>

           </div>
        }
        <div class="column flex-1">
            <h3>Rounds</h3>
            <app-tournament-rounds-list
              [tournament]="$tournament()!"
              [players]="store.$state()!.players!"
              (valuesChanged)="tournamentRoundsChanged($event)">
            </app-tournament-rounds-list>
        </div>
        @if(isRankingViewSelected()) {
            <div class ="column ranking">
                rankingrankingrankingrankingranking
            </div>
        }
        
    }
    </div>      
</div>
