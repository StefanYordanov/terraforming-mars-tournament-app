<table mat-table [dataSource]="$computedPlayerRankingsSorted()" class="mat-shadow-2">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="rank">
    <th mat-header-cell *matHeaderCellDef> # </th>
    <td mat-cell *matCellDef="let element"> {{element.rank}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="player">
    <th mat-header-cell *matHeaderCellDef> Player </th>
    <td mat-cell *matCellDef="let element"> {{element.player.name}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="qualifierTournamentPoints">
    <th mat-header-cell *matHeaderCellDef> Qualifier RP </th>
    <td mat-cell *matCellDef="let element"> {{element.qualifierTournamentPoints?.join(', ')}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="qualifierDominancePointsTotal">
    <th mat-header-cell *matHeaderCellDef> Dominance </th>
    <td mat-cell *matCellDef="let element"> {{element.qualifierDominancePointsTotal | number:'1.0-3' }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
