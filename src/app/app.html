<main class="main">
  <div class="content">
    <mat-toolbar class="navigation" color="primary">
      <div>
        <button mat-button routerLink="/home">Terraforming Mars Tournament</button>
      </div>
      <div>
        <button mat-button [disabled]="!store.$canUndo()" (click)="store.undo()" >Undo</button>
        <button mat-button [disabled]="!store.$canRedo()" (click)="store.redo()" >Redo</button>
      </div>
      
    </mat-toolbar>

    <div class="app-body">
      <aside class="side">
        <!-- left side content preserved -->
      </aside>

      <section class="main-content">
        <p-toast position="bottom-right" />
        <router-outlet></router-outlet>
      </section>
    </div>
  </div>
</main>
